[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# TASK-010b: startCommand allineato al CMD del Dockerfile — node server.mjs diretto.
# Evita double-build ad ogni restart Railway (il build avviene nel Dockerfile RUN).
startCommand = "node server.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
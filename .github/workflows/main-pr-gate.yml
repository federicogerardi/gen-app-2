name: Main PR Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/contracts/**'

jobs:
  frontend-gate:
    name: Typecheck + Tests + A11y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm --workspace apps/frontend run typecheck

      - name: Run tests
        run: npm --workspace apps/frontend run test

      - name: Form validation regression tests
        run: npm --workspace apps/frontend run test:forms

      - name: Visual snapshot regression tests
        run: npm --workspace apps/frontend run test:visual

      - name: Admin Dashboard Combined Tests (Router + Mutations + A11y)
        run: npm --workspace apps/frontend run test:admin-combined

      - name: Admin A11y Smoke Tests (vitest + axe, 6 admin routes)
        run: npm --workspace apps/frontend run test:admin-a11y

      - name: Build
        run: npm --workspace apps/frontend run build

      # - name: Accessibility full browser audit (local only)
      #   run: npm --workspace apps/frontend run audit:a11y
      # NOTE: audit:a11y requires full stack (backend + DB) — use audit-admin-a11y.sh locally
